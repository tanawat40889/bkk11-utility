name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # public values (the publishable key is designed to ship to browsers)
      NEXT_PUBLIC_SUPABASE_URL: https://cqdzfsucpivsgznfpjxl.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_XkUBjE3M7HUiuDv7YwsbKA_mSu0ToEc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Registration/package-lock.json
      - name: Build Registration -> /bkk11-utility/registration/
        working-directory: Registration
        run: |
          npm ci
          npm run build
      - name: Assemble site
        run: |
          mkdir -p site
          mv Registration/out site/registration
          cp -R Runsheet site/runsheet
          cp -R Runsheet site/Runsheet   # same page at the branch-build path, so the link works whichever build serves the site
          echo '<!doctype html><meta charset="utf-8"><meta http-equiv="refresh" content="0;url=registration/"><title>BKK11 Utility</title>' > site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
